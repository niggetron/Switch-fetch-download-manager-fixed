name: Build & Publish Release APK

# Builds an arm64-v8a release APK on every push to main and publishes it to the
# Releases tab with an automatically bumped version name (base from
# app/build.gradle.kts, e.g. "1.0" -> "1.0.<run number>").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compute version
        id: ver
        run: |
          BASE="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | tail -n1)"
          BASE="${BASE:-1.0}"
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION} (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Prepare signing key
        run: |
          test -f my-upload-key.jks || { echo "::error::my-upload-key.jks missing from repo"; exit 1; }
          echo "STORE_PASSWORD=aetherio-ci" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=aetherio-ci" >> "$GITHUB_ENV"

      - name: Build arm64-v8a release APK
        run: |
          gradle :app:assembleRelease \
            -PciVersionCode=${{ steps.ver.outputs.version_code }} \
            -PciVersionName=${{ steps.ver.outputs.version_name }} \
            -PciAbiFilter=arm64-v8a \
            --stacktrace

      - name: Stage APK for release
        run: |
          VERSION="${{ steps.ver.outputs.version_name }}"
          mkdir -p dist
          APK="$(ls app/build/outputs/apk/release/*release*.apk 2>/dev/null | head -n1)"
          if [ -z "$APK" ]; then echo "::error::No release APK found"; exit 1; fi
          cp "$APK" "dist/AetherIO-v${VERSION}-arm64-v8a.apk"
          ls -la dist

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version_name }}
        run: |
          gh release create "v${VERSION}" \
            "dist/AetherIO-v${VERSION}-arm64-v8a.apk" \
            --title "AetherIO v${VERSION}" \
            --latest \
            --notes "$(printf 'Automated arm64-v8a release build\n\n- **Version name:** %s\n- **Version code:** %s\n- **Commit:** %s\n- **Branch:** %s\n' \
              "${VERSION}" "${{ github.run_number }}" "${{ github.sha }}" "${{ github.ref_name }}")"
