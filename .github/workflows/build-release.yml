name: Build & Publish Release APK

# Builds Pure Rust `libaether_core.so` (arm64-v8a) via cargo-ndk + Gradle buildRustCore,
# compiles BoringSSL with ARMv8 hardware AES/SHA ASM (-DANDROID_ABI=arm64-v8a),
# runs Rust & Android unit tests, verifies .so packaging, and publishes GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install native cross-compile toolchain (BoringSSL / NDK deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build perl pkg-config libclang-dev

      - name: Set up Android NDK
        run: |
          NDK_VERSION="27.2.12479018"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null
          NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_ABI=arm64-v8a" >> "$GITHUB_ENV"
          echo "CARGO_NDK_ANDROID_ABI=arm64-v8a" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE=${NDK_DIR}/build/cmake/android.toolchain.cmake" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Set up Rust (stable + aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/aether-core/target
          key: ${{ runner.os }}-cargo-ndk-v8-${{ hashFiles('rust/aether-core/Cargo.toml', 'rust/aether-core/Cargo.lock') }}

      - name: Verify bundled font assets & SIL OFL licenses
        run: |
          test -f app/src/main/res/font/space_grotesk.ttf
          test -f app/src/main/res/font/inter.ttf
          test -f app/src/main/res/font/jetbrains_mono.ttf
          test -f app/src/main/assets/font_licenses.txt

      - name: Run Rust host unit tests (aether-core v8.0)
        working-directory: rust/aether-core
        run: cargo test --lib

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build libaether_core.so (arm64-v8a) via Gradle cargo-ndk integration
        env:
          ANDROID_ABI: arm64-v8a
          CARGO_NDK_CMAKE_TOOLCHAIN_FILE: ${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake
        run: |
          gradle :app:buildRustCore -PrequireRustBuild=true --stacktrace
          ls -lh app/src/main/jniLibs/arm64-v8a/libaether_core.so

      - name: Compute version
        id: ver
        run: |
          BASE="$(grep -oP 'ciVersionName.*?\?:\s*"\K[^"]+' app/build.gradle.kts | head -n1)"
          BASE="${BASE:-1.0}"
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION} (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Prepare signing key
        run: |
          test -f my-upload-key.jks || { echo "::error::my-upload-key.jks missing from repo"; exit 1; }
          echo "STORE_PASSWORD=aetherio-ci" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=aetherio-ci" >> "$GITHUB_ENV"

      - name: Run Android Unit & Multi-Network Tests
        run: gradle :app:testDebugUnitTest -PskipRustBuild=true --stacktrace

      - name: Build arm64-v8a release APK
        run: |
          gradle :app:assembleRelease \
            -PrequireRustBuild=true \
            -PciVersionCode=${{ steps.ver.outputs.version_code }} \
            -PciVersionName=${{ steps.ver.outputs.version_name }} \
            -PciAbiFilter=arm64-v8a \
            --stacktrace

      - name: Verify libaether_core.so is packaged in APK & Stage Release
        run: |
          VERSION="${{ steps.ver.outputs.version_name }}"
          mkdir -p dist
          APK="$(ls app/build/outputs/apk/release/*release*.apk 2>/dev/null | head -n1)"
          if [ -z "$APK" ]; then echo "::error::No release APK found"; exit 1; fi
          unzip -l "$APK" | grep "lib/arm64-v8a/libaether_core.so" || {
            echo "::error::libaether_core.so missing from packaged APK!";
            exit 1;
          }
          cp "$APK" "dist/AetherIO-v${VERSION}-arm64-v8a.apk"
          ls -lh dist

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version_name }}
        run: |
          gh release create "v${VERSION}" \
            "dist/AetherIO-v${VERSION}-arm64-v8a.apk" \
            --title "AetherIO v${VERSION}" \
            --latest \
            --notes "$(printf 'Automated arm64-v8a release build (AetherIO Engine v8.0)\n\n- **Version name:** %s\n- **Version code:** %s\n- **Native core:** libaether_core.so (arm64-v8a, panic=unwind, BoundedSlabPool Semaphore(16)+ArrayQueue, wreq prefix-symbols + quinn/h3 0-RTT, AETHLDG2 + memfd)\n- **Commit:** %s\n- **Branch:** %s\n' \
              "${VERSION}" "${{ github.run_number }}" "${{ github.sha }}" "${{ github.ref_name }}")"
