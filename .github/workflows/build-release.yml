name: Build & Publish Release APK

# Builds the Pure Rust `libaether_core.so` (arm64-v8a) via cargo-ndk, runs Rust
# & Android unit tests, packages the signed arm64-v8a release APK, and publishes
# it to GitHub Releases on every push to main or manual workflow_dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android NDK
        run: |
          NDK_VERSION="27.2.12479018"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust (stable + aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/aether-core/target
          key: ${{ runner.os }}-cargo-ndk-${{ hashFiles('rust/aether-core/Cargo.toml') }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Run Rust host unit tests (aether-core)
        working-directory: rust/aether-core
        run: cargo test --lib

      - name: Build libaether_core.so (arm64-v8a)
        working-directory: rust/aether-core
        run: |
          cargo ndk -t arm64-v8a -p 24 -o ../../app/src/main/jniLibs build --release
          ls -lh ../../app/src/main/jniLibs/arm64-v8a/libaether_core.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compute version
        id: ver
        run: |
          BASE="$(grep -oP 'ciVersionName.*?\?:\s*"\K[^"]+' app/build.gradle.kts | head -n1)"
          BASE="${BASE:-1.0}"
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION} (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Prepare signing key
        run: |
          test -f my-upload-key.jks || { echo "::error::my-upload-key.jks missing from repo"; exit 1; }
          echo "STORE_PASSWORD=aetherio-ci" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=aetherio-ci" >> "$GITHUB_ENV"

      - name: Run Android Unit & Multi-Network Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build arm64-v8a release APK
        run: |
          gradle :app:assembleRelease \
            -PciVersionCode=${{ steps.ver.outputs.version_code }} \
            -PciVersionName=${{ steps.ver.outputs.version_name }} \
            -PciAbiFilter=arm64-v8a \
            --stacktrace

      - name: Verify libaether_core.so is packaged in APK & Stage Release
        run: |
          VERSION="${{ steps.ver.outputs.version_name }}"
          mkdir -p dist
          APK="$(ls app/build/outputs/apk/release/*release*.apk 2>/dev/null | head -n1)"
          if [ -z "$APK" ]; then echo "::error::No release APK found"; exit 1; fi
          unzip -l "$APK" | grep "lib/arm64-v8a/libaether_core.so" || {
            echo "::error::libaether_core.so missing from packaged APK!";
            exit 1;
          }
          cp "$APK" "dist/AetherIO-v${VERSION}-arm64-v8a.apk"
          ls -lh dist

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version_name }}
        run: |
          gh release create "v${VERSION}" \
            "dist/AetherIO-v${VERSION}-arm64-v8a.apk" \
            --title "AetherIO v${VERSION}" \
            --latest \
            --notes "$(printf 'Automated arm64-v8a release build with compiled Rust libaether_core.so\n\n- **Version name:** %s\n- **Version code:** %s\n- **Native core:** libaether_core.so (arm64-v8a, panic=unwind, memfd + pwrite + fallocate + AETHLDG1)\n- **Commit:** %s\n- **Branch:** %s\n' \
              "${VERSION}" "${{ github.run_number }}" "${{ github.sha }}" "${{ github.ref_name }}")"
