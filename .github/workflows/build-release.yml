name: Build & Publish Release APK (arm64-v8a + Rust Core)

# Automated CI/CD pipeline for AetherIO Engine v9.0:
# 1. Compiles Pure Rust `libaether_core.so` (arm64-v8a) via cargo-ndk (BoringSSL + QUIC + Anti-Dip)
# 2. Runs Rust unit tests, Android Robolectric unit tests, and Android Release Lint
# 3. Assigns a UNIQUE APK package name (`com.aistudio.aetherio.b<run_number>`) on every new build
# 4. Verifies `lib/arm64-v8a/libaether_core.so` is bundled inside the APK and computes SHA-256
# 5. Generates structured release notes (Added, Upgraded & Enhanced, Fixed, Changed, Removed)
#    and publishes the APK + checksum to GitHub Releases.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_override:
        description: "Optional version override (e.g. 9.1.0); leave blank for auto 9.0.<run_number>"
        required: false
        default: ""
      extra_notes:
        description: "Optional custom highlight to prepend to GitHub Release notes"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bundle aria2-next (Rayburst engine) arm64 executable
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          # Trust anchor is config/aria2-next.lock committed in THIS repo. The
          # upstream release asset is mutable (gh release upload --clobber), so
          # fetching the checksum from the same origin is not sufficient.
          VER="$(python3 -c 'import json;print(json.load(open("config/aria2-next.lock"))["version"])')"
          ASSET="$(python3 -c 'import json;print(json.load(open("config/aria2-next.lock"))["asset"])')"
          EXPECT_SHA="$(python3 -c 'import json;print(json.load(open("config/aria2-next.lock"))["sha256"])')"
          EXPECT_SIZE="$(python3 -c 'import json;print(json.load(open("config/aria2-next.lock"))["size"])')"
          BASE="https://github.com/AnInsomniacy/aria2-next/releases/download/v${VER}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o app/src/main/assets/aria2-next \
            "${BASE}/${ASSET}"
          ACTUAL="$(sha256sum app/src/main/assets/aria2-next | awk '{print $1}')"
          FILE_SIZE="$(stat -c%s app/src/main/assets/aria2-next)"
          if [ "$EXPECT_SHA" != "$ACTUAL" ]; then
            echo "::error::aria2-next checksum mismatch (expected $EXPECT_SHA, got $ACTUAL)"; exit 1
          fi
          if [ "$EXPECT_SIZE" != "$FILE_SIZE" ]; then
            echo "::error::aria2-next size mismatch (expected $EXPECT_SIZE, got $FILE_SIZE)"; exit 1
          fi
          # Structural sanity: must be a 64-bit AArch64 ELF linked only to Bionic.
          file app/src/main/assets/aria2-next
          readelf -h app/src/main/assets/aria2-next | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          chmod +x app/src/main/assets/aria2-next
          echo "Bundled aria2-next ${VER} (${ACTUAL}, ${FILE_SIZE} bytes) - pinned digest verified"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install native cross-compile toolchain (BoringSSL / NDK deps)
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list || true
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build perl pkg-config libclang-dev

      - name: Set up Android NDK
        run: |
          if [ -n "${ANDROID_NDK_ROOT:-}" ] && [ -d "${ANDROID_NDK_ROOT}" ]; then
            NDK_DIR="${ANDROID_NDK_ROOT}"
          elif [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "${ANDROID_NDK_HOME}" ]; then
            NDK_DIR="${ANDROID_NDK_HOME}"
          else
            NDK_VERSION="27.2.12479018"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null
            NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          fi
          echo "Using Android NDK at: ${NDK_DIR}"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> "$GITHUB_ENV"

      - name: Set up Rust (stable + aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/aether-core/target
          key: ${{ runner.os }}-cargo-ndk-v9-${{ hashFiles('rust/aether-core/Cargo.toml', 'rust/aether-core/Cargo.lock') }}

      - name: Verify bundled font assets & SIL OFL licenses
        run: |
          test -f app/src/main/res/font/space_grotesk.ttf
          test -f app/src/main/res/font/inter.ttf
          test -f app/src/main/res/font/jetbrains_mono.ttf
          test -f app/src/main/assets/font_licenses.txt

      - name: Run Rust host unit tests (aether-core v9.0)
        working-directory: rust/aether-core
        run: cargo test --lib

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build libaether_core.so (arm64-v8a, 16 KB ELF aligned) via Gradle cargo-ndk integration
        env:
          ANDROID_ABI: arm64-v8a
          CARGO_NDK_ANDROID_ABI: arm64-v8a
          CARGO_NDK_CMAKE_TOOLCHAIN_FILE: ${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake
          # C10 audit: env RUSTFLAGS REPLACES config-level rustflags, so the
          # "+neon" in .cargo/config.toml was inert in release. Keep both flags
          # in one place so the SIMD path cannot be dropped later.
          RUSTFLAGS: "-C target-feature=+neon -C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          gradle :app:buildRustCore -PrequireRustBuild=true --stacktrace
          ls -lh app/src/main/jniLibs/arm64-v8a/libaether_core.so
          readelf -lW app/src/main/jniLibs/arm64-v8a/libaether_core.so | grep LOAD
          for align in $(readelf -lW app/src/main/jniLibs/arm64-v8a/libaether_core.so | awk '/LOAD/{print $NF}'); do
            if (( align < 16384 )); then
              echo "::error::LOAD segment alignment ${align} is less than 16 KB (0x4000)!"
              exit 1
            fi
          done

      - name: Bundle libc++_shared.so required by libaether_core.so
        run: |
          # The Rust cdylib links the Android C++ runtime dynamically (NEEDED:
          # libc++_shared.so). Without shipping it, System.loadLibrary() fails
          # with "dlopen failed: library libc++_shared.so not found" and the app
          # silently falls back to Kotlin even though the .so is in the APK.
          LIBCXX="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" \
            -path "*aarch64-linux-android*" -name libc++_shared.so -type f 2>/dev/null | head -n1)"
          if [ -z "$LIBCXX" ]; then
            echo "::error::libc++_shared.so not found under $ANDROID_NDK_HOME"
            exit 1
          fi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LIBCXX" app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          echo "Bundled $LIBCXX -> app/src/main/jniLibs/arm64-v8a/libc++_shared.so"

      - name: Verify every native library dependency is bundled
        run: |
          SO="app/src/main/jniLibs/arm64-v8a/libaether_core.so"
          for dep in $(readelf -d "$SO" | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/'); do
            case "$dep" in
              libc.so|libm.so|libdl.so|liblog.so) continue ;;
            esac
            if [ ! -f "app/src/main/jniLibs/arm64-v8a/$dep" ]; then
              echo "::error::$dep is needed by libaether_core.so but is not bundled in jniLibs"
              exit 1
            fi
            echo "Resolved native dependency: $dep"
          done

      - name: Compute version & unique package name per build
        id: ver
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          BASE="$(grep -oP 'ciVersionName.*?\?:\s*"\K[^"]+' app/build.gradle.kts | head -n1)"
          BASE="${BASE:-9.1}"
          # Inputs arrive via env: never interpolate them into shell source.
          OVERRIDE="$VERSION_OVERRIDE"
          if [ -n "$OVERRIDE" ]; then
            VERSION="$OVERRIDE"
          else
            VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          SHORT_SHA="$(git rev-parse --short=6 HEAD)"
          UNIQUE_PKG="com.aistudio.aetherio.b${GITHUB_RUN_NUMBER}"
          echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "package_name=${UNIQUE_PKG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building AetherIO v${VERSION} (versionCode ${GITHUB_RUN_NUMBER}) with unique applicationId=${UNIQUE_PKG}"

      - name: Prepare signing key
        run: |
          test -f my-upload-key.jks || { echo "::error::my-upload-key.jks missing from repo"; exit 1; }
          echo "STORE_PASSWORD=aetherio-ci" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=aetherio-ci" >> "$GITHUB_ENV"

      - name: Run Android Unit Tests & Release Vital Lint
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest -PskipRustBuild=true --stacktrace 2>&1 | tee /tmp/android_test.log || {
            python3 -c "d=open('/tmp/android_test.log').read()[-6000:]; print('::error::'+d.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          }
          gradle :app:lintVitalRelease -PskipRustBuild=true --stacktrace

      - name: Build arm64-v8a release APK (Dual-Engine Rust + Kotlin, Unique Package Name)
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libaether_core.so
          gradle :app:assembleRelease \
            -PskipRustBuild=true \
            -PciVersionCode=${{ steps.ver.outputs.version_code }} \
            -PciVersionName=${{ steps.ver.outputs.version_name }} \
            -PciApplicationId=${{ steps.ver.outputs.package_name }} \
            -PciAbiFilter=arm64-v8a \
            --stacktrace

      - name: Verify libaether_core.so is packaged in APK & Generate SHA-256
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version_name }}"
          mkdir -p dist
          APK="$(ls app/build/outputs/apk/release/*release*.apk 2>/dev/null | head -n1)"
          if [ -z "$APK" ]; then echo "::error::No release APK found"; exit 1; fi
          unzip -l "$APK" | grep "lib/arm64-v8a/libaether_core.so" || {
            echo "::error::libaether_core.so missing from packaged APK!";
            exit 1;
          }
          unzip -l "$APK" | grep "lib/arm64-v8a/libc++_shared.so" || {
            echo "::error::libc++_shared.so missing from packaged APK - native load will fail!";
            exit 1;
          }
          SO_SIZE="$(ls -lh app/src/main/jniLibs/arm64-v8a/libaether_core.so | awk '{print $5}')"
          OUT_APK="dist/AetherIO-v${VERSION}-arm64-v8a.apk"
          cp "$APK" "$OUT_APK"
          APK_SIZE="$(ls -lh "$OUT_APK" | awk '{print $5}')"
          SHA256="$(sha256sum "$OUT_APK" | awk '{print $1}')"
          printf "%s  %s\n" "$SHA256" "$(basename "$OUT_APK")" > "${OUT_APK}.sha256"
          echo "so_size=${SO_SIZE}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Generate Categorized Release Notes (Added / Upgraded / Fixed / Changed / Removed)
        env:
          EXTRA_NOTES: ${{ inputs.extra_notes }}
        run: |
          VERSION="${{ steps.ver.outputs.version_name }}"
          PKG_NAME="${{ steps.ver.outputs.package_name }}"
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            COMMIT_RANGE="${PREV_TAG}..HEAD"
          else
            COMMIT_RANGE="HEAD~20..HEAD"
          fi

          {
            echo "# AetherIO v${VERSION} (arm64-v8a Triple-Engine Release)"
            echo ""
            if [ -n "$EXTRA_NOTES" ]; then
              echo "> $EXTRA_NOTES"
              echo ""
            fi
            echo "## Build & Binary Verification"
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **Version** | \`v${VERSION}\` (build \`${{ steps.ver.outputs.version_code }}\`) |"
            echo "| **Unique APK Package Name** | \`${PKG_NAME}\` *(changes on every CI build for clean side-by-side installs)* |"
            echo "| **ABI Architecture** | \`arm64-v8a\` |"
            echo "| **Bundled Engines** | **Rust \`libaether_core.so\` (${{ steps.pkg.outputs.so_size }})** + **Kotlin OkHttp Turbo** + **aria2-next (Rayburst)** |"
            echo "| **APK Size** | \`${{ steps.pkg.outputs.apk_size }}\` |"
            echo "| **SHA-256** | \`${{ steps.pkg.outputs.sha256 }}\` |"
            echo "| **Commit / Branch** | \`${{ steps.ver.outputs.short_sha }}\` on \`${{ github.ref_name }}\` |"
            echo ""

            echo "## What's Changed"
            echo ""
            section() {
              LABEL="$1"; PATTERN="$2"
              LINES="$(git log "${COMMIT_RANGE}" --no-merges --pretty=format:"%s" 2>/dev/null \
                | grep -iE "$PATTERN" \
                | sed -E 's/^[A-Za-z]+(\([^)]*\))?!?: //I' \
                | sed 's/^/- /' || true)"
              if [ -n "$LINES" ]; then
                echo "### $LABEL"
                echo "$LINES"
                echo ""
              fi
            }
            section "Added" '^feat'
            section "Fixed" '^fix|^hotfix'
            section "Upgraded & Enhanced" '^perf|^improve'
            section "Changed" '^refactor|^chore|^style'
            section "Removed" '^remove|^revert'

            echo "### Commits in ${COMMIT_RANGE}"
            git log "${COMMIT_RANGE}" --no-merges --pretty=format:"- \`%h\` %s (%an)" 2>/dev/null \
              || git log -n 10 --pretty=format:"- \`%h\` %s (%an)"
            echo ""
            echo "[Full Changelog](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION})"
            echo ""
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publish APK & Checksum to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}
          name: AetherIO v${{ steps.ver.outputs.version_name }} (${{ steps.ver.outputs.package_name }})
          body_path: dist/RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/AetherIO-v${{ steps.ver.outputs.version_name }}-arm64-v8a.apk
            dist/AetherIO-v${{ steps.ver.outputs.version_name }}-arm64-v8a.apk.sha256
