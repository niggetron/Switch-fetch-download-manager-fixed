[package]
name = "aether-core"
version = "6.0.1"
edition = "2024"
description = "AetherIO Omega v6.0 stable-Rust JNI core (BLAKE3 CAS, GF256 RLNC, multipath scheduler, 2MB F2FS extents)"
license = "MIT OR Apache-2.0"

[lib]
name = "aether_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# io_uring is used by the optional 2 MB F2FS extent commit path (Linux/Android).
io-uring = "0.7"
# SIMD BLAKE3 for the content-addressed chunk index.
blake3 = "1.6"
# Stable JNI bindings (0.21 works with the Kotlin external fun signatures).
jni = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
