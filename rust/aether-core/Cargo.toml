[package]
name = "aether-core"
version = "8.0.0"
edition = "2024"
description = "AetherIO Engine v8.0 Production Pure Rust Data Plane: Semaphore BoundedSlabPool (8 MiB), real shared memfd telemetry, fallocate+pwrite+fdatasync, AETHLDG2 crash-safe ledger, wreq BoringSSL (prefix-symbols) + quinn/h3 0-RTT, multi-mirror Earliest-Arrival, HLS/DASH, Aria2 RPC"
license = "MIT OR Apache-2.0"

[lib]
name = "aether_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustix = { version = "0.38", features = ["fs"] }
libc = "0.2"
socket2 = "0.5"
crossbeam-queue = "0.3"
bytes = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
wreq = { version = "0.16", default-features = false, features = ["tokio-rt", "webpki-roots", "system-proxy", "charset", "prefix-symbols", "socks", "stream"] }
wreq-util = "0.2"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
blake3 = "1.5"
sha2 = "0.10"
crc32c = "0.6"
jni = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
